<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCD · Gestión documental</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<meta name="theme-color" content="#000000">
<style>
  /* =============================================================
     MCD · Panel. Colores del logo: negro, azul y cian.
     ============================================================= */
  :root {
    --fondo:#f4f6fa; --panel:#ffffff; --texto:#111827; --suave:#5b6475; --borde:#e2e6ee; --gris-f:#f1f3f7;
    --marca:#0a4fc4; --marca-fuerte:#0716c8; --marca-suave:#e8f0ff; --cian:#00b8d4; --cian-suave:#e0f8fc;
    --rail:#05080f; --rail-texto:#c7d2e3; --rail-activo:#0a4fc4;
    --ok:#137a43; --ok-f:#e3f5ea; --aviso:#9a5b00; --aviso-f:#fff2d9; --error:#b42318; --error-f:#fdecea;
    --sombra:0 1px 2px rgba(15,23,42,.05), 0 4px 14px rgba(15,23,42,.04); --radio:14px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) { :root { color-scheme:dark;
    --fondo:#0b0f17; --panel:#141a25; --texto:#e8edf5; --suave:#9aa6b8; --borde:#273041; --gris-f:#1b2230;
    --marca:#5b9bff; --marca-fuerte:#7fb0ff; --marca-suave:#16264a; --cian:#38d6ee; --cian-suave:#0f3340;
    --ok:#6fd49b; --ok-f:#12301f; --aviso:#f2c66d; --aviso-f:#33290f; --error:#f59a91; --error-f:#3a1a17; --sombra:none; } }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:15px/1.5 "Segoe UI",-apple-system,Roboto,Arial,sans-serif; background:var(--fondo); color:var(--texto); min-height:100vh; }
  h1,h2,h3 { line-height:1.2; margin:0; }
  .sub { color:var(--suave); font-size:13px; margin:2px 0 0; }
  .oculto { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, label:focus-within.zona-subida { outline:3px solid var(--cian); outline-offset:2px; }
  .saltar { position:fixed; z-index:20; top:-100px; left:12px; padding:12px; background:#fff; color:var(--marca); }
  .saltar:focus { top:8px; }

  /* ---------- Cabecera ---------- */
  header { background:var(--rail); color:#fff; display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:10px clamp(14px,2.5vw,32px); min-height:68px;
    border-bottom:3px solid; border-image:linear-gradient(90deg,#00d8ec,#0a86f2,#0716c8) 1; }
  .logo { display:flex; align-items:center; gap:14px; } .logo img { height:48px; width:auto; display:block; }
  .logo span { color:#dbe6f5; font-weight:600; font-size:15px; padding-left:14px; border-left:1px solid #22324d; }
  .usuario { margin-left:auto; display:flex; gap:10px; align-items:center; flex-wrap:wrap; color:var(--rail-texto); font-size:13px; }
  .usuario .boton { background:transparent; color:#fff; border-color:#334663; min-height:34px; padding:6px 14px; }
  .usuario .boton:hover { background:#16213a; }
  .logo-acceso { display:block; margin:0 auto 16px; height:104px; width:auto; padding:14px 24px; background:#000; border-radius:16px; }

  /* ---------- Menú lateral ---------- */
  .icono-panel { width:20px; height:20px; display:inline-block; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  nav:empty { display:none; }
  nav { background:var(--rail); padding:16px 12px; display:flex; flex-direction:column; gap:4px; }
  nav button { display:flex; align-items:center; gap:12px; width:100%; padding:11px 14px; min-height:46px; border:0; border-radius:10px; background:none;
    color:var(--rail-texto); font:inherit; font-weight:600; text-align:left; cursor:pointer; }
  nav button:hover { background:#121b2e; color:#fff; }
  nav button.activo { background:var(--rail-activo); color:#fff; box-shadow:inset 3px 0 var(--cian); }
  nav .nav-usuarios { margin-top:14px; position:relative; }
  nav .nav-usuarios::before { content:''; position:absolute; left:8px; right:8px; top:-8px; border-top:1px solid #22324d; }
  nav .num { margin-left:auto; background:#ff8a00; color:#111; border-radius:999px; padding:0 8px; font-size:12px; font-weight:700; }
  .nav-movil { display:none; }
  nav button.nav-subir { background:var(--marca); color:#fff; margin-bottom:10px; justify-content:center; }
  nav button.nav-subir:hover { background:var(--marca-fuerte); }
  .capa-soltar { position:fixed; inset:0; z-index:60; background:rgba(10,79,196,.18); display:grid; place-items:center; pointer-events:none; }
  .capa-soltar[hidden] { display:none; }
  .capa-soltar > div { background:var(--panel); border:3px dashed var(--marca); border-radius:18px; padding:34px 40px; display:grid; justify-items:center; gap:8px;
    color:var(--marca); text-align:center; box-shadow:var(--sombra); }
  .capa-soltar .icono-panel { width:40px; height:40px; } .capa-soltar b { font-size:20px; } .capa-soltar span { color:var(--suave); }

  /* ---------- Estructura ---------- */
  main { width:100%; min-width:0; padding:clamp(16px,3vw,36px); max-width:1400px; margin:0 auto; }
  footer { text-align:center; color:var(--suave); font-size:12px; padding:14px 18px 22px; }
  footer .boton { min-height:30px; padding:4px 10px; margin-left:6px; }
  @media (min-width:961px) {
    body:has(#menu button) { display:grid; grid-template-columns:232px minmax(0,1fr); grid-template-rows:auto 1fr auto;
      background:linear-gradient(90deg, var(--rail) 232px, var(--fondo) 232px); }
    body:has(#menu button) > header { grid-column:1/-1; }
    body:has(#menu button) > #menu { grid-column:1; grid-row:2/4; position:sticky; top:0; align-self:start; max-height:100vh; overflow:auto; }
    body:has(#menu button) > main, body:has(#menu button) > footer { grid-column:2; }
  }
  .cab-vista { display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:22px; }
  .cab-vista h1 { font-size:clamp(26px,2.6vw,36px); letter-spacing:-.03em; }
  .cab-vista .sub { font-size:14px; margin-top:6px; }

  /* ---------- Piezas comunes ---------- */
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:var(--radio); padding:20px; box-shadow:var(--sombra); min-width:0; }
  .tarjeta h2 { font-size:18px; letter-spacing:-.01em; } .tarjeta > h2 { margin-bottom:12px; }
  .tarjeta h3 { font-size:15px; margin:0 0 6px; color:var(--marca); }
  .tarjeta-titulo { display:flex; gap:14px; align-items:flex-start; margin-bottom:16px; }
  .icono-redondo { display:grid; place-items:center; width:44px; height:44px; border-radius:12px; flex-shrink:0; background:var(--marca-suave); color:var(--marca); }
  .icono-redondo.verde { background:var(--ok-f); color:var(--ok); } .icono-redondo.naranja { background:var(--aviso-f); color:var(--aviso); }
  .icono-redondo.cian { background:var(--cian-suave); color:#007c91; } .icono-redondo .icono-panel { width:22px; height:22px; }
  .pill { display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:600; background:var(--gris-f); color:var(--suave); white-space:nowrap; }
  .pill.ok { background:var(--ok-f); color:var(--ok); } .pill.aviso { background:var(--aviso-f); color:var(--aviso); }
  .pill.error { background:var(--error-f); color:var(--error); } .pill.marca { background:var(--marca-suave); color:var(--marca); }
  header .pill.marca { background:#16264a; color:#cfe0ff; }
  .boton { display:inline-flex; align-items:center; justify-content:center; gap:8px; color:var(--marca); border:1px solid var(--borde); background:var(--panel);
    border-radius:10px; padding:9px 15px; font:inherit; font-size:14px; font-weight:600; min-height:42px; cursor:pointer; text-decoration:none; white-space:nowrap; }
  .boton:hover:not(:disabled) { background:var(--marca-suave); border-color:#c9d8f5; } .boton:disabled { opacity:.55; cursor:wait; }
  .boton.principal { background:var(--marca); color:#fff; border-color:var(--marca); }
  .boton.principal:hover:not(:disabled) { background:var(--marca-fuerte); }
  .boton.descarga { background:#127a3e; border-color:#127a3e; color:#fff; } .boton.descarga:hover:not(:disabled) { background:#0e6633; border-color:#0e6633; }
  .boton.revisar { background:var(--ok); color:#fff; border-color:var(--ok); } .boton.peligro { background:var(--error-f); color:var(--error); border-color:transparent; }
  .boton.enlace { border:0; background:none; color:var(--marca); text-decoration:underline; padding:6px 4px; min-height:0; }
  input, select, textarea { border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:10px; padding:9px 12px; font:inherit; font-size:14px; min-height:42px; }
  input[type=checkbox] { min-height:0; width:18px; height:18px; accent-color:var(--marca); }
  .en-linea { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .vacio { padding:32px; text-align:center; color:var(--suave); }
  .cargando { color:var(--suave); padding:40px; text-align:center; }
  .mensaje { padding:10px 12px; border-radius:10px; font-size:13px; margin-top:10px; } .mensaje:empty { display:none; }
  .mensaje.error { background:var(--error-f); color:var(--error); } .mensaje.ok { background:var(--ok-f); color:var(--ok); }
  .mensaje-ficha { font-size:13px; overflow-wrap:anywhere; } .mensaje-ficha:empty { display:none; }
  .mensaje-ficha.exito { color:var(--ok); } .mensaje-ficha.fallo { color:var(--error); }
  .formulario-usuario { display:grid; grid-template-columns:2fr 1.5fr 1fr; gap:12px; align-items:end; margin-top:14px; }
  .formulario-usuario > label:not(.casilla) { display:grid; gap:5px; font-size:13px; font-weight:600; color:var(--suave); }
  .formulario-usuario input:not([type=checkbox]), .formulario-usuario select { width:100%; }
  .formulario-usuario .casilla, .formulario-usuario .en-linea { grid-column:1/-1; }
  .casilla { display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }
  .roles { margin:10px 0 0; padding-left:18px; color:var(--suave); font-size:13px; display:grid; gap:2px; } .roles b { color:var(--texto); }
  @media (max-width:700px) { .formulario-usuario { grid-template-columns:1fr; } }
  .formulario { display:grid; gap:12px; } .formulario label { display:grid; gap:5px; font-size:13px; font-weight:600; color:var(--suave); }
  .formulario label input, .formulario label select { width:100%; }

  /* ---------- Inicio ---------- */
  .metricas { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-bottom:20px; }
  .metrica { display:flex; gap:16px; align-items:center; text-align:left; cursor:pointer; color:var(--texto); background:var(--panel);
    border:1px solid var(--borde); border-radius:var(--radio); padding:20px; font:inherit; box-shadow:var(--sombra); transition:border-color .15s, transform .15s; }
  .metrica:hover { border-color:var(--marca); transform:translateY(-1px); }
  .metrica .icono-redondo { width:52px; height:52px; }
  .metrica-texto { display:grid; } .metrica strong { font-size:34px; line-height:1.05; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .metrica-nombre { font-weight:700; } .metrica-ayuda { color:var(--suave); font-size:13px; }
  .metrica.naranja { border-left:5px solid #ff9f1a; } .metrica.verde { border-left:5px solid #22a35a; }
  .metrica.azul { border-left:5px solid var(--marca); } .metrica.cian { border-left:5px solid var(--cian); }
  .inicio-columnas { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .columna { display:grid; gap:16px; min-width:0; }
  .tarjeta-excel { border-top:4px solid #127a3e; }
  .excel-campos { display:grid; grid-template-columns:1fr 1fr auto; gap:12px; align-items:end; }
  .excel-campos label { display:grid; gap:5px; font-size:13px; font-weight:600; color:var(--suave); min-width:0; }
  .excel-campos select, .excel-campos input { width:100%; }
  .excel-campos input[type=month] { margin-top:6px; }
  .estado-excel { display:block; color:var(--suave); font-size:13px; margin-top:8px; } .estado-excel:empty { display:none; }
  .descarga-directa .estado-excel { margin-top:4px; text-align:right; }
  .zona-subida { display:grid; justify-items:center; gap:4px; text-align:center; padding:22px; margin-bottom:12px; border:2px dashed #c4d3ee; border-radius:12px;
    background:var(--marca-suave); color:var(--marca); cursor:pointer; }
  .zona-subida:hover, .zona-subida.encima { border-color:var(--marca); background:#dbe7ff; }
  .zona-subida .icono-panel { width:28px; height:28px; }
  .lista-subidas { list-style:none; margin:0 0 12px; padding:0; display:grid; gap:6px; }
  .subida { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:4px 10px; align-items:center; padding:10px 12px; border-radius:10px; background:var(--gris-f); font-size:13px; }
  .subida-nombre { font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .subida-estado { grid-column:2 / 4; color:var(--suave); } .subida .boton.enlace { padding:0; }
  .subida.exito { background:var(--ok-f); } .subida.exito .subida-estado { color:var(--ok); }
  .subida.aviso { background:var(--aviso-f); } .subida.aviso .subida-estado { color:var(--aviso); }
  .subida.fallo { background:var(--error-f); } .subida.fallo .subida-estado { color:var(--error); }
  .punto.espera { background:#9aa6b8; animation:latir 1.2s ease-in-out infinite; } @keyframes latir { 50% { opacity:.3; } }
  @media (prefers-reduced-motion: reduce) { .punto.espera { animation:none; } }
  .tickets-subir { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:10px; }
  .tickets-subir.encima { outline:3px dashed var(--marca); outline-offset:4px; border-radius:14px; }
  .boton-grande { display:flex; align-items:center; gap:14px; padding:18px 20px; border-radius:14px; border:2px solid var(--borde); background:var(--panel);
    color:var(--marca); cursor:pointer; min-height:76px; }
  .boton-grande:hover { border-color:var(--marca); background:var(--marca-suave); }
  .boton-grande .icono-panel { width:30px; height:30px; flex-shrink:0; }
  .boton-grande b { display:block; font-size:16px; } .boton-grande small { display:block; color:var(--suave); font-size:13px; }
  .boton-grande.principal { background:var(--marca); border-color:var(--marca); color:#fff; }
  .boton-grande.principal small { color:#dbe7ff; } .boton-grande.principal:hover { background:var(--marca-fuerte); }
  .total-grande { font-size:24px; font-weight:800; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  @media (max-width:700px) { .tickets-subir { grid-template-columns:1fr; } .boton-grande { min-height:84px; } }
  .lista-empresas { display:grid; gap:2px; }
  .empresa-fila { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:10px 0; border-top:1px solid var(--borde); }
  .empresa-fila:first-child { border-top:0; }
  .empresa-nombre { display:grid; } .empresa-nombre b { font-size:16px; }
  .empresa-datos { display:flex; gap:6px; flex-wrap:wrap; }
  .dato { border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:999px; padding:5px 12px; font:inherit; font-size:13px; cursor:pointer; }
  .dato:hover { border-color:var(--marca); color:var(--marca); } .dato b { font-variant-numeric:tabular-nums; }
  .dato.aviso { background:var(--aviso-f); color:var(--aviso); border-color:transparent; }
  .ultimos { list-style:none; margin:0; padding:0; display:grid; }
  .ultimos li { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--borde); font-size:13px; }
  .ultimos li:first-child { border-top:0; }
  .ultimo-id { font-weight:700; font-variant-numeric:tabular-nums; } .ultimo-archivo { color:var(--suave); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ultimo-empresa, .ultimo-fecha { color:var(--suave); white-space:nowrap; }
  .linea-servicio { margin:20px 0 0; color:var(--suave); font-size:13px; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .punto { width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:6px; } .punto.ok { background:#22a35a; } .punto.error { background:#e5484d; }

  /* ---------- Listas (facturas, albaranes…) ---------- */
  .herramientas { background:var(--panel); border:1px solid var(--borde); border-radius:var(--radio); padding:14px; margin-bottom:14px; display:grid; gap:12px; box-shadow:var(--sombra); }
  .fila-herramientas { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .fila-herramientas:first-child { justify-content:space-between; align-items:center; }
  .fila-herramientas input[type=search] { flex:1 1 280px; min-width:0; }
  .campo-corto { display:grid; gap:4px; font-size:12px; font-weight:600; color:var(--suave); }
  .campo-corto select { min-width:170px; }
  .contador { color:var(--suave); font-size:13px; margin-left:auto; align-self:center; }
  .segmentos { display:inline-flex; flex-wrap:wrap; gap:4px; background:var(--gris-f); padding:4px; border-radius:12px; }
  .segmentos button { border:0; background:none; color:var(--suave); border-radius:9px; padding:8px 16px; font:inherit; font-weight:600; cursor:pointer; min-height:38px; }
  .segmentos button:hover { color:var(--texto); }
  .segmentos button.activo { background:var(--panel); color:var(--marca); box-shadow:0 1px 3px rgba(15,23,42,.12); }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chips button { border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:999px; padding:7px 14px; font:inherit; font-size:14px; font-weight:600; cursor:pointer; min-height:38px; }
  .chips button.activo { background:var(--marca); border-color:var(--marca); color:#fff; }
  .barra { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .tabla { overflow:auto; background:var(--panel); border:1px solid var(--borde); border-radius:var(--radio); box-shadow:var(--sombra); max-height:calc(100vh - 260px); }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th { text-align:left; background:var(--gris-f); color:var(--suave); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.03em; padding:11px 14px; position:sticky; top:0; white-space:nowrap; z-index:1; }
  td { padding:12px 14px; border-top:1px solid var(--borde); vertical-align:middle; white-space:nowrap; }
  td.largo { white-space:normal; min-width:220px; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; } td.num { font-weight:600; }
  tbody tr.abrible { cursor:pointer; } tbody tr.abrible:hover { background:var(--marca-suave); }
  .abrir-fila { color:var(--marca); background:none; border:0; padding:0; font:inherit; font-weight:700; text-align:left; cursor:pointer; }
  .abrir-fila:hover { text-decoration:underline; }
  .paginacion { display:flex; gap:12px; align-items:center; justify-content:center; margin-top:14px; color:var(--suave); font-size:14px; }
  .miga { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-size:14px; align-items:center; } .miga span { color:var(--suave); }
  .fila { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); margin-bottom:18px; }
  main h3 { margin:22px 0 10px; font-size:17px; }

  /* ---------- Ventana de ficha ---------- */
  .modal { position:fixed; inset:0; background:rgba(5,8,15,.6); display:none; align-items:center; justify-content:center; padding:12px; z-index:10; }
  .modal.abierto { display:flex; }
  .caja { background:var(--panel); border-radius:16px; width:min(900px,100%); max-height:92vh; overflow:auto; padding:20px; box-shadow:0 20px 50px rgba(0,0,0,.3); }
  .caja .cab { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; } .caja .cab h3 { margin:0; font-size:18px; flex:1; overflow-wrap:anywhere; }
  .caja.revision-amplia { width:min(1560px,98vw); max-height:96vh; padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .caja.revision-amplia > .cab { padding:14px 20px; margin:0; border-bottom:1px solid var(--borde); }
  .contenido-revision { min-height:0; display:flex; flex-direction:column; }
  .zona-revision { display:grid; grid-template-columns:minmax(300px,1fr) minmax(420px,1fr); height:calc(96vh - 166px); min-height:240px; }
  .vista-documento { display:flex; flex-direction:column; min-height:0; background:var(--gris-f); border-right:1px solid var(--borde); }
