<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCD · Gestión documental</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="icono.svg">
<meta name="theme-color" content="#000000">
<style>
  :root {
    --fondo:#f5f6f8; --panel:#fff; --texto:#1d2433; --suave:#5b6475; --borde:#e3e6eb;
    --marca:#2456c4; --marca-suave:#eaf0ff; --acento:#0f766e; --violeta:#6d28d9; --superficie:#f0f5fc;
    --ok:#1e7a46; --ok-f:#e3f3e9; --aviso:#8a5a00; --aviso-f:#fff3d6; --error:#b42318; --error-f:#fdecea; --gris-f:#eef0f3;

  }
  @media (prefers-color-scheme: dark) { :root { color-scheme:dark;
    --fondo:#12151b; --panel:#1b2028; --texto:#e6e9ef; --suave:#9aa3b2; --borde:#2b313c; --marca:#91b7ff; --marca-suave:#203351;
    --acento:#238c80; --violeta:#b49bff; --superficie:#151f2d; --ok:#6fd49b; --ok-f:#16301f; --aviso:#f2c66d; --aviso-f:#33290f;
    --error:#f59a91; --error-f:#3a1a17; --gris-f:#242a34; --sombra:none; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif; background:linear-gradient(145deg,var(--fondo),var(--superficie)); color:var(--texto); min-height:100vh; }
  header { background:#000; border-bottom:3px solid; border-image:linear-gradient(90deg,#00d8ec,#0a86f2,#0716c8) 1; padding:10px max(20px,calc((100% - 1240px)/2)); display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { display:flex; align-items:center; gap:14px; color:#fff; } .logo img { height:56px; width:auto; display:block; }
  .logo span { color:#cfe6f5; font-weight:500; font-size:15px; padding-left:14px; border-left:1px solid #1d3a5c; }
  .logo-acceso { display:block; margin:0 auto 14px; height:110px; width:auto; padding:14px 22px; background:#000; border-radius:14px; }
  .usuario { margin-left:auto; color:#dae7ee; font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .usuario .boton { color:#fff; border-color:#5b7a99; background:transparent; }
  nav { background:var(--panel); border-bottom:1px solid var(--borde); padding:0 max(12px,calc((100% - 1240px)/2)); display:flex; gap:6px; overflow-x:auto; }
  nav button { background:none; border:0; border-bottom:2px solid transparent; padding:14px 16px; font:inherit; color:var(--suave); cursor:pointer; white-space:nowrap; border-radius:9px 9px 0 0; }
  nav button.activo { color:var(--marca); border-bottom-color:var(--marca); font-weight:600; background:var(--marca-suave); }

  main { padding:20px; max-width:1280px; margin:0 auto; }
  .fila { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); margin-bottom:18px; }
  .tarjeta { background:var(--panel); border:1px solid var(--borde); border-radius:10px; padding:16px; box-shadow:var(--sombra); min-width:0; }
  .tarjeta h3 { margin:0 0 4px; font-size:15px; color:var(--marca); } .tarjeta .sub { color:var(--suave); font-size:12px; margin-bottom:10px; }
  .indicadores .tarjeta { border-top:4px solid var(--marca); } .indicadores .tarjeta:nth-child(2) { border-top-color:var(--violeta); } .indicadores .tarjeta:nth-child(3) { border-top-color:var(--acento); }
  .tarjeta.empresa { border-left:4px solid var(--marca); } .empresa.empresa-1 { border-left-color:var(--violeta); } .empresa.empresa-2 { border-left-color:var(--acento); }
  .cifra { font-size:clamp(26px,3vw,36px); line-height:1.2; font-weight:700; color:var(--marca); font-variant-numeric:tabular-nums; }
  .etq { color:var(--suave); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .datos { display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:13px; } .datos b { text-align:right; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; background:var(--gris-f); color:var(--suave); white-space:nowrap; }
  .pill.ok { background:var(--ok-f); color:var(--ok); } .pill.aviso { background:var(--aviso-f); color:var(--aviso); } .pill.error { background:var(--error-f); color:var(--error); } .pill.marca { background:var(--marca-suave); color:var(--marca); }
  .barra { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .chips button { border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:999px; padding:6px 13px; font:inherit; cursor:pointer; }
  .chips button.activo { background:var(--marca); border-color:var(--marca); color:#fff; }
  input, select, textarea { border:1px solid var(--borde); background:var(--panel); color:var(--texto); border-radius:8px; padding:8px 10px; font:inherit; }
  input[type=search], select { min-width:220px; }

  .tabla { overflow:auto; background:var(--panel); border:1px solid var(--borde); border-radius:10px; max-height:65vh; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th { text-align:left; background:var(--gris-f); color:var(--suave); font-weight:600; padding:9px 12px; position:sticky; top:0; white-space:nowrap; }
  td { padding:9px 12px; border-top:1px solid var(--borde); vertical-align:top; white-space:nowrap; }
  td.largo { white-space:normal; min-width:220px; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr.abrible { cursor:pointer; } tbody tr.abrible:hover { background:var(--marca-suave); }
  .abrir-fila { color:var(--marca); background:none; border:0; padding:0; font:inherit; text-align:left; text-decoration:underline; cursor:pointer; }
  .vacio { padding:36px; text-align:center; color:var(--suave); }
  .miga { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; font-size:14px; align-items:center; } .miga span { color:var(--suave); }
  .boton { color:var(--marca); border:1px solid var(--borde); background:var(--panel); border-radius:9px; padding:9px 13px; font:inherit; font-size:13px; min-height:36px; cursor:pointer; text-decoration:none; display:inline-block; }
  .boton:hover:not(:disabled) { background:var(--marca-suave); } .boton:disabled { opacity:.5; cursor:default; }
  .boton.principal { background:var(--marca); color:#fff; border-color:var(--marca); font-weight:650; } .boton.principal:hover:not(:disabled) { background:var(--marca); filter:brightness(1.08); }
  .boton.revisar { background:var(--acento); color:#fff; border-color:var(--acento); font-weight:650; } .boton.peligro { background:var(--error-f); color:var(--error); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible { outline:3px solid #75a7ff; outline-offset:2px; }
  footer { text-align:center; color:var(--suave); font-size:12px; padding:18px; }
  .modal { position:fixed; inset:0; background:rgba(16,32,58,.65); display:none; align-items:center; justify-content:center; padding:12px; z-index:10; }
  .modal.abierto { display:flex; }
  .caja { background:var(--panel); border-radius:12px; width:min(900px,100%); max-height:92vh; overflow:auto; padding:18px; }
  .caja .cab { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; } .caja .cab h3 { margin:0; font-size:16px; flex:1; overflow-wrap:anywhere; }
  .caja.revision-amplia { width:min(1560px,98vw); max-height:96vh; padding:0; overflow:hidden; display:flex; flex-direction:column; }
  .caja.revision-amplia > .cab { padding:14px 20px; margin:0; border-bottom:1px solid var(--borde); }
  .contenido-revision { min-height:0; display:flex; flex-direction:column; }
  .zona-revision { display:grid; grid-template-columns:minmax(300px,.9fr) minmax(420px,1.1fr); height:calc(96vh - 166px); min-height:240px; }
  .vista-documento { display:flex; flex-direction:column; min-height:0; background:var(--superficie); border-right:1px solid var(--borde); }
  .cab-documento { padding:14px 16px; border-bottom:1px solid var(--borde); } .cab-documento h3 { margin:0 0 8px; font-size:15px; color:var(--marca); }
  .opciones-documento, .enlaces-documento { display:flex; flex-wrap:wrap; gap:8px; } .enlaces-documento { padding:10px 14px; }
  .visor-documento { flex:1; min-height:0; overflow:auto; } .visor-documento iframe, .visor-documento img { width:100%; height:100%; min-height:260px; border:0; background:#fff; object-fit:contain; }
  .editor-documento { padding:18px 22px; overflow:auto; min-width:0; }
  .resumen-ficha { display:flex; gap:8px; flex-wrap:wrap; } .ayuda-campo { font-size:12px; color:var(--suave); line-height:1.6; margin:10px 0 14px; }
  .seccion-ficha { min-width:0; margin:0 0 18px; padding:14px; border:1px solid var(--borde); border-radius:12px; background:var(--panel); }
  .seccion-ficha legend { padding:0 6px; font-weight:650; color:var(--marca); font-size:14px; }
  .campos-ficha { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; } .campo-ficha { min-width:0; } .campo-ancho { grid-column:1/-1; }
  .campo-ficha label, .etiqueta-ficha { display:block; font-size:12px; color:var(--suave); font-weight:600; margin-bottom:6px; }
  .campo-ficha input, .campo-ficha select, .campo-ficha textarea { width:100%; min-width:0; padding:10px 11px; }
  .campo-ficha textarea { resize:vertical; line-height:1.55; min-height:90px; } .valor-ficha { white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; }
  .resumen-importes { margin-top:14px; padding:11px; border-radius:8px; font-size:12px; line-height:1.6; }
  .resumen-importes.cuadra { color:var(--ok); background:var(--ok-f); } .resumen-importes.diferencia { color:var(--aviso); background:var(--aviso-f); }
  .datos-adicionales { padding:12px 0; } .datos-adicionales summary { cursor:pointer; color:var(--marca); font-weight:600; }
  .otros-datos { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; padding:16px 0; }
  .pie-revision { border-top:1px solid var(--borde); background:var(--panel); padding:12px 20px; display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center; }
  .cambios-ficha { font-size:12px; color:var(--suave); } .mensaje-ficha { font-size:13px; overflow-wrap:anywhere; } .mensaje-ficha:empty { display:none; }
  .mensaje-ficha.exito { color:var(--ok); } .mensaje-ficha.fallo { color:var(--error); }
  .acciones-revision { display:flex; flex-wrap:wrap; gap:8px; grid-column:2; grid-row:1/3; justify-content:flex-end; }
  .modo-datos .zona-revision { grid-template-columns:1fr; } .modo-datos .vista-documento { display:none; }
  .aviso-total { max-width:520px; margin:80px auto; text-align:center; } .cargando { color:var(--suave); padding:30px; text-align:center; }
  .formulario { display:grid; gap:10px; } .formulario label { display:grid; gap:4px; font-size:13px; color:var(--suave); } .formulario label input, .formulario label select { width:100%; }
  .acceso { max-width:420px; margin:60px auto; } .acceso h2 { margin:0 0 6px; color:var(--marca); } .acceso .enlaces { display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:13px; }
  .acceso .enlaces button { background:none; border:0; color:var(--marca); cursor:pointer; text-decoration:underline; font:inherit; padding:0; }
  .mensaje { padding:10px 12px; border-radius:8px; font-size:13px; margin-top:10px; } .mensaje.error { background:var(--error-f); color:var(--error); } .mensaje.ok { background:var(--ok-f); color:var(--ok); } .mensaje:empty { display:none; }
  .en-linea { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  @media (max-width:900px) { .zona-revision { display:block; height:auto; max-height:calc(96vh - 180px); overflow:auto; } .vista-documento { height:320px; border-right:0; border-bottom:1px solid var(--borde); } .pie-revision { display:block; padding:12px; } .acciones-revision { margin-top:10px; } }
  @media (max-width:640px) { main { padding:12px; } header { padding:12px; } .usuario { flex-basis:100%; } input[type=search], select { min-width:0; width:100%; } .campos-ficha, .otros-datos { grid-template-columns:1fr; } .modal { padding:4px; } }

  /* Estructura de trabajo: navegación estable y espacio de lectura. */
  :root { --fondo:#f3f6f7; --panel:#fff; --texto:#182d38; --suave:#506570; --borde:#d9e3e7;
    --marca:#11646b; --marca-suave:#e5f3f1; --acento:#11646b; --rail:#15323c; --gris-f:#edf2f4;
    --superficie:#edf4f4; --sombra:0 2px 5px rgba(16,43,52,.035); color-scheme:light; }
  body { background:var(--fondo); color:var(--texto); font-size:15px; }
  [hidden] { display:none !important; }
  header { min-height:74px; background:var(--rail); padding:12px clamp(16px,2.5vw,40px); border:0; gap:16px; }
  .logo img { height:45px; } .logo span { font-size:15px; color:#edf6f8; border-color:#49707b; }
  header .usuario { min-width:0; overflow-wrap:anywhere; }
  .icono-panel { width:20px; height:20px; display:inline-block; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
  nav:empty { display:none; }
  nav { background:var(--rail); border:none; padding:18px 12px; }
  nav button { display:flex; align-items:center; gap:12px; padding:12px 15px; min-height:44px; border:none; border-radius:8px; color:#d5e4e7; text-align:left; }
  nav button:hover { background:#254751; color:white; }
  nav button.activo { color:white; background:#28626a; box-shadow:inset 3px 0 #7dd4cb; }
  nav .nav-usuarios { margin-top:18px; border-top:1px solid #42606a; border-radius:0; padding-top:18px; }
  nav .num { margin-left:auto; }
  .nav-movil { display:none; }
  main { width:100%; min-width:0; padding:clamp(18px,3vw,44px); max-width:1540px; }
  h1,h2,h3 { line-height:1.18; }
  .cab-vista,.excel-cab { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; }
  .cab-vista { margin:0 0 25px; } h1 { margin:0; font-size:clamp(29px,3.2vw,46px); letter-spacing:-.048em; }
  main h2 { margin:26px 0 12px; font-size:21px; letter-spacing:-.025em; }
  .tarjeta,.tabla,.excel-zona { border-radius:15px; box-shadow:var(--sombra); }
  .metricas { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-bottom:22px; }
  .metrica { position:relative; display:grid; grid-template-columns:1fr auto; align-items:start; text-align:left; cursor:pointer; color:var(--texto); background:var(--panel); border:1px solid var(--borde); border-radius:16px; padding:20px; font:inherit; }
  .metrica:hover { border-color:var(--marca); }
  .metrica-icono { grid-column:1; background:var(--marca-suave); color:var(--marca); border-radius:10px; display:grid; place-items:center; width:39px; height:39px; margin-bottom:14px; }
  .metrica-albaranes .metrica-icono { background:#e8effb; color:#315582; }
  .metrica-revision .metrica-icono { background:#fff0d6; color:#8b5010; }
  .metrica-nombre { grid-column:1/-1; color:var(--suave); font-size:14px; font-weight:600; }
  .metrica strong { grid-column:1; font-size:clamp(30px,3vw,44px); line-height:1.15; letter-spacing:-.05em; font-variant-numeric:tabular-nums; }
  .flecha { position:absolute; top:20px; right:18px; color:var(--suave); }
  .empresa.tarjeta { border:1px solid var(--borde); padding:18px; }
  .empresa h3 { font-size:20px; color:var(--texto); } .empresa .datos { margin:12px 0; }
  .empresa .datos span,.empresa .datos b { padding:3px 0; }
  .boton,.chips button { min-height:40px; font-weight:600; } .boton:disabled { cursor:wait; }
  .boton.descarga,.boton.descarga:hover:not(:disabled) { color:white; background:#11646b; border-color:#11646b; }
  .boton.descarga:hover:not(:disabled) { background:#0b5157; }
  .barra { gap:12px; align-items:end; }
  .barra label,.excel-form label:has(>select) { display:grid; gap:5px; color:var(--suave); font-size:13px; font-weight:600; }
  .barra .contador { align-self:center; }
  .excel-zona { margin:16px 0; padding:19px 22px; border:1px solid var(--borde); background:var(--panel); }
  .excel-cab h2 { margin:0; font-size:19px; } .excel-cab p { margin:4px 0 0; color:var(--suave); }
  .descarga-directa { display:grid; justify-items:start; gap:4px; }
  .estado-excel,.excel-form [role=status] { color:var(--suave); font-size:13px; } .estado-excel:empty { display:none; }
  .excel-opciones { margin-top:14px; border-top:1px solid var(--borde); }
  summary { cursor:pointer; font-weight:600; color:var(--marca); padding:9px 0; }
  .excel-opciones>summary { padding:12px 0 0; } .excel-form { margin-top:15px; }
  .excel-form fieldset fieldset { border:1px solid var(--borde); border-radius:10px; padding:12px; }
  .excel-form button { justify-self:start; }
  .excel-form input[type=checkbox],td input[type=checkbox] { width:18px; height:18px; accent-color:var(--marca); cursor:pointer; }
  .servicio-detalle { margin-top:24px; }
  .tabla th { font-weight:650; } .tabla td,.tabla th { padding:11px 13px; } tbody tr:nth-child(even) { background:var(--fondo); }
  input[type=file] { max-width:100%; min-width:0; }
  .tabla:focus-visible { outline:3px solid #347fbe; }
  .acceso { padding:30px; margin:8vh auto; } .acceso h2 { margin-top:16px; }
  .saltar { position:fixed; z-index:20; top:-100px; left:12px; padding:12px; background:white; color:#104950; }
  .saltar:focus { top:8px; }
  @media(min-width:901px) {
    body:has(#menu button) { display:grid; grid-template-columns:214px minmax(0,1fr); grid-template-rows:auto 1fr auto; align-content:start; }
    body:has(#menu button)>header { grid-column:1/-1; }
    #menu:not(:empty) { display:flex; flex-direction:column; grid-column:1; grid-row:2/4; align-self:start; position:sticky; top:0; min-height:calc(100vh - 74px); }
    body:has(#menu button)>main,body:has(#menu button)>footer { grid-column:2; }
  }
  @media(max-width:900px) {
    nav:not(:empty) { display:block; padding:8px 16px; } nav button { display:none; }
    .nav-movil { display:block; width:100%; min-height:42px; background:#224955; color:white; border-color:#53737c; }
    main { padding:18px; } .metrica { padding:15px; } .metricas { gap:8px; }
  }
  @media(max-width:600px) {
    header { gap:8px; } header .usuario { font-size:12px; }
    .cab-vista { margin-bottom:16px; } .cab-vista h1 { width:100%; }
    .metricas { grid-template-columns:1fr; }
    .metrica { grid-template-columns:34px 1fr auto; align-items:center; gap:12px; padding:11px 14px; }
    .metrica-icono { grid-column:1; margin:0; width:34px; height:34px; }
    .metrica-nombre { grid-column:2; } .metrica strong { grid-column:3; font-size:26px; } .metrica .flecha { display:none; }
    .barra label,.excel-cab>.descarga-directa,.excel-form button { width:100%; } .excel-zona { padding:15px; }
    .barra select,.excel-form select { max-width:100%; }
  }
  @media(prefers-color-scheme:dark) {
    :root { color-scheme:dark; --fondo:#15232a; --panel:#1b2d35; --texto:#eef5f5; --suave:#b2c7cb; --borde:#385059; --gris-f:#263c44; --marca:#8cdbd2; --marca-suave:#254c4c; --superficie:#20353e; }
    .chips button.activo,.boton.principal { color:#132b2d; }
  }

</style>
</head>
<body>
<a class="saltar" href="#vista">Saltar al contenido</a>
<header>
  <div class="logo"><img src="logo.svg" alt="MCD"><span>Gestión documental</span></div>
  <span id="estadoServicio" class="pill" hidden>Servicio…</span>
  <div class="usuario" id="usuario"></div>
</header>
<nav id="menu" aria-label="Secciones del panel"></nav>
<main id="vista" tabindex="-1"><div class="cargando">Cargando…</div></main>
<footer id="pie" hidden><span id="actualizado"></span> · se actualiza solo cada 30 segundos · <button class="boton" id="btnActualizar">Actualizar ahora</button></footer>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal"><div class="caja" id="caja"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="config.js"></script>
<script src="app.js?v=gestion-20261110"></script>
</body>
